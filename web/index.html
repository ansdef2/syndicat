<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Синдикат — платформа учёта ТЧЧ</title>
<meta name="description" content="Локальная платформа синдиката: эмиссия токенов человеко-часов, ценообразование через полные трудозатраты, индексация заработной платы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/syndicat.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314100C'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%238E1B14' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23F5D98A'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">

  <aside class="rail">
    <div class="mark">
      <span class="wedge" aria-hidden="true"></span>
      <span class="hairline" aria-hidden="true"></span>
      <b>СИНДИ<span>КАТ</span></b>
      <i>ОКВЭД 20-30 · локальный контур</i>
    </div>
    <nav class="nav" aria-label="Разделы панели">
      <div class="group">Сеть</div>
      <button data-view="overview" aria-current="true">Обзор сети</button>
      <div class="group">Генерация</div>
      <button data-view="generation">Токены человеко-часов</button>
      <button data-view="smoothing">Сглаживание и база часа</button>
      <div class="group">Цена</div>
      <button data-view="pricing">Ценообразование</button>
      <button data-view="channel">Каналы субститутов</button>
      <div class="group">Субъекты</div>
      <button data-view="enterprises">Реестр предприятий</button>
      <button data-view="indexation">Индексация зарплаты</button>
      <div class="group">Основание</div>
      <button data-view="model">Модель и параметры</button>
    </nav>
    <div class="foot">
      Локальный запуск: <code>python3 -m syndicat</code>
      <a href="/api/overview" target="_blank" rel="noopener">расчётное API</a>
      <a id="csv" href="/api/export/calibration.csv">выгрузка калибровки, CSV</a>
    </div>
  </aside>

  <main class="canvas">
    <header class="topbar">
      <div>
        <h1 id="view-title">Обзор сети</h1>
        <div class="sub" id="view-sub">курс ТЧЧ, отраслевые коэффициенты, контур эмиссии</div>
      </div>
      <div class="spacer"></div>
      <div class="ctrl">
        <label for="phi">норма социализации φ</label>
        <input type="range" id="phi" min="0" max="1" step="0.01" value="0.35">
        <output id="phi-out" for="phi">0,35</output>
      </div>
      <a class="btn ghost" href="/api/export/calibration.csv">CSV</a>
    </header>

    <div class="view active" id="view"><div class="loading">расчёт…</div></div>
  </main>

</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
